name: CI Pipeline

on:
  push:
    branches: ["main", "master", "feature/devops"]
  pull_request:
    branches: ["main", "master", "feature/devops"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: node -e "require('./app.js')" && echo "Tests passed!" || echo "Tests failed!"

      - name: Build Docker image
        run: docker build -t express-hello-world .

      - name: Notify success
        if: success()
        run: echo "CI Pipeline completed successfully!"

      - name: Notify failure
        if: failure()
        run: echo "CI Pipeline FAILED! Please check the logs."
